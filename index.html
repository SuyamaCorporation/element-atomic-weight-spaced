<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>元素・原子量スペースドリビュー</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .fade-in{animation:fadeIn 0.2s ease forwards}
  @keyframes cardPop{0%{transform:scale(0.95)}100%{transform:scale(1)}}
  .card-pop{animation:cardPop 0.2s ease forwards}
  .opt-btn{transition:background 0.12s,border-color 0.12s;}
</style>
</head>
<body class="bg-zinc-900 text-white min-h-screen flex flex-col">

<header class="bg-zinc-800 shadow px-4 py-3 flex items-center justify-between">
  <h1 class="text-lg font-bold">⚗️ 元素周期表スペースドリビュー</h1>
  <div class="flex gap-2 text-xs">
    <span id="hdr-due" class="bg-blue-700 px-2 py-1 rounded">予定: 0</span>
    <span id="hdr-mastered" class="bg-emerald-700 px-2 py-1 rounded">習得: 0</span>
  </div>
</header>

<main class="flex-1 flex flex-col items-center px-4 py-6 gap-5 max-w-xl mx-auto w-full">

  <!-- Group filter + quiz mode -->
  <div class="w-full flex flex-wrap gap-2 justify-center">
    <button class="grp-btn px-3 py-2 rounded text-xs font-semibold bg-sky-600" id="g-light" onclick="setGroup('light')" aria-label="軽元素グループ">軽元素 Z1–20</button>
    <button class="grp-btn px-3 py-2 rounded text-xs font-semibold bg-zinc-700" id="g-trans" onclick="setGroup('trans')" aria-label="遷移金属グループ">遷移金属 Z21–56</button>
    <button class="grp-btn px-3 py-2 rounded text-xs font-semibold bg-zinc-700" id="g-rare" onclick="setGroup('rare')" aria-label="希土類・重元素グループ">希土類 Z57–118</button>
    <div class="flex rounded overflow-hidden border border-zinc-600">
      <button id="qm-name" onclick="setQMode('name')" class="qm-btn px-3 py-1 text-xs bg-purple-600 text-white" aria-label="記号から名前モード">記号→名前</button>
      <button id="qm-sym" onclick="setQMode('sym')" class="qm-btn px-3 py-1 text-xs bg-zinc-700 text-zinc-300" aria-label="名前から記号モード">名前→記号</button>
    </div>
    <button onclick="startReview()" class="px-3 py-2 rounded text-xs font-semibold bg-orange-500 hover:bg-orange-400 transition" aria-label="復習開始">▶ 復習</button>
  </div>

  <!-- Progress bar group -->
  <div class="w-full flex gap-3 text-xs text-zinc-400">
    <div class="flex-1">
      <div class="flex justify-between mb-1"><span>軽元素</span><span id="pg-light">0%</span></div>
      <div class="bg-zinc-700 rounded-full h-2"><div id="pb-light" class="bg-sky-500 h-2 rounded-full" style="width:0%"></div></div>
    </div>
    <div class="flex-1">
      <div class="flex justify-between mb-1"><span>遷移金属</span><span id="pg-trans">0%</span></div>
      <div class="bg-zinc-700 rounded-full h-2"><div id="pb-trans" class="bg-amber-500 h-2 rounded-full" style="width:0%"></div></div>
    </div>
    <div class="flex-1">
      <div class="flex justify-between mb-1"><span>希土類</span><span id="pg-rare">0%</span></div>
      <div class="bg-zinc-700 rounded-full h-2"><div id="pb-rare" class="bg-pink-500 h-2 rounded-full" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Quiz card -->
  <div id="quiz-card" class="card-pop fade-in w-full bg-gradient-to-br from-zinc-700 to-zinc-800 rounded-2xl shadow-xl p-6 text-center">
    <div id="q-atomic" class="text-xs text-zinc-400 mb-1">Z -</div>
    <div id="q-main" class="text-6xl font-bold mb-1 tracking-wide">-</div>
    <div id="q-sub" class="text-sm text-zinc-300 mb-1">-</div>
  </div>

  <!-- Options -->
  <div id="options-grid" class="w-full grid grid-cols-2 gap-3"></div>

  <!-- Feedback -->
  <div id="feedback-box" class="hidden w-full p-4 rounded-xl text-center font-bold" role="alert"></div>

  <!-- Info card after correct -->
  <div id="info-card" class="hidden w-full bg-zinc-800 rounded-2xl p-5 text-sm fade-in">
    <div class="font-bold text-yellow-300 text-lg mb-2" id="ic-title"></div>
    <div class="grid grid-cols-2 gap-2 text-zinc-300" id="ic-body"></div>
  </div>

</main>

const STORAGE='elem_sr_v1';
let group='light', qmode='name';
let progress={};
let queue=[];
let currentEl=null;
let answered=false;

function loadProgress(){progress=JSON.parse(localStorage.getItem(STORAGE)||'{}');}
function saveProgress(){localStorage.setItem(STORAGE,JSON.stringify(progress));}
function getP(z){if(!progress[z])progress[z]={correct:0,incorrect:0,interval:1,due:0};return progress[z];}

function elByGroup(g){return ELEMENTS.filter(e=>e[4]===g);}
function allFiltered(){return elByGroup(group);}

function setGroup(g){
  group=g;
  ['light','trans','rare'].forEach(x=>{
    document.getElementById('g-'+x).className='grp-btn px-3 py-2 rounded text-xs font-semibold '+(x===g?'bg-sky-600':'bg-zinc-700');
  });
  updateProgressBars();
  startReview();
}
function setQMode(m){
  qmode=m;
  document.getElementById('qm-name').className='qm-btn px-3 py-1 text-xs '+(m==='name'?'bg-purple-600 text-white':'bg-zinc-700 text-zinc-300');
  document.getElementById('qm-sym').className='qm-btn px-3 py-1 text-xs '+(m==='sym'?'bg-purple-600 text-white':'bg-zinc-700 text-zinc-300');
}

function masteredCount(g){
  return elByGroup(g).filter(e=>{const p=getP(e[0]);return p.correct>=3&&p.correct>p.incorrect;}).length;
}
function updateProgressBars(){
  ['light','trans','rare'].forEach(g=>{
    const els=elByGroup(g);
    const pct=els.length===0?0:Math.round((masteredCount(g)/els.length)*100);
    document.getElementById('pb-'+g).style.width=pct+'%';
    document.getElementById('pg-'+g).textContent=pct+'%';
  });
  const all=allFiltered();
  const now=Date.now();
  const due=all.filter(e=>getP(e[0]).due<=now).length;
  const mastered=masteredCount(group);
  document.getElementById('hdr-due').textContent='予定: '+due;
  document.getElementById('hdr-mastered').textContent='習得: '+mastered;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildQueue(){
  const els=allFiltered();
  const now=Date.now();
  const due=els.filter(e=>getP(e[0]).due<=now);
  return shuffle([...due]);
}

function startReview(){
  queue=buildQueue();
  if(queue.length===0){
    queue=shuffle([...allFiltered()]).slice(0,10);
  }
  nextCard();
}

function nextCard(){
  answered=false;
  document.getElementById('info-card').classList.add('hidden');
  document.getElementById('feedback-box').classList.add('hidden');
  if(queue.length===0){
    queue=buildQueue();
    if(queue.length===0){
      document.getElementById('q-main').textContent='✅';
      document.getElementById('q-sub').textContent='本日の復習完了！';
      document.getElementById('q-atomic').textContent='';
      document.getElementById('options-grid').innerHTML='';
      return;
    }
  }
  currentEl=queue.shift();
  const [z,sym,nameJa,weight,grp,period,config,year,use]=currentEl;
  document.getElementById('q-atomic').textContent=`Z${z} / 原子量 ${weight}`;
  if(qmode==='name'){
    document.getElementById('q-main').textContent=sym;
    document.getElementById('q-sub').textContent='第'+period+'周期';
  } else {
    document.getElementById('q-main').textContent=nameJa;
    document.getElementById('q-sub').textContent='第'+period+'周期';
  }

  // Build options
  const pool=shuffle([...ELEMENTS]).filter(e=>e[0]!==z).slice(0,3);
  const opts=shuffle([currentEl,...pool]);
  const grid=document.getElementById('options-grid');
  grid.innerHTML='';
  opts.forEach(el=>{
    const btn=document.createElement('button');
    btn.className='opt-btn bg-zinc-700 hover:bg-zinc-600 rounded-xl p-3 text-sm font-semibold text-center border-2 border-transparent transition';
    btn.setAttribute('aria-label','選択肢: '+(qmode==='name'?el[2]:el[1]));
    btn.textContent=qmode==='name'?el[2]:el[1];
    btn.onclick=()=>selectOpt(el[0]===z, btn, currentEl);
    grid.appendChild(btn);
  });
}

function selectOpt(isCorrect, btn, el){
  if(answered)return;
  answered=true;
  const [z,sym,nameJa,weight,grp,period,config,year,use]=el;
  const p=getP(z);
  const fb=document.getElementById('feedback-box');
  fb.classList.remove('hidden');
  if(isCorrect){
    p.correct++;
    p.interval=Math.min(p.interval*2,30);
    p.due=Date.now()+p.interval*24*3600*1000;
    btn.className='opt-btn bg-emerald-700 rounded-xl p-3 text-sm font-semibold text-center border-2 border-emerald-400 transition';
    fb.className='w-full p-3 rounded-xl text-center font-bold bg-emerald-800 text-emerald-200';
    fb.textContent='⭕ 正解！';
    showInfoCard(el);
  } else {
    p.incorrect++;
    p.interval=1;
    p.due=Date.now()+3600*1000;
    btn.className='opt-btn bg-red-800 rounded-xl p-3 text-sm font-semibold text-center border-2 border-red-400 transition';
    fb.className='w-full p-3 rounded-xl text-center font-bold bg-red-900 text-red-200';
    fb.textContent='❌ 不正解。正解: '+(qmode==='name'?nameJa:sym);
    // show correct
    document.querySelectorAll('#options-grid button').forEach(b=>{
      if(b.textContent===(qmode==='name'?nameJa:sym)){
        b.className='opt-btn bg-emerald-800 rounded-xl p-3 text-sm font-semibold text-center border-2 border-emerald-400 transition';
      }
    });
    showInfoCard(el);
  }
  saveProgress();
  updateProgressBars();
  setTimeout(nextCard,2000);
}

function showInfoCard(el){
  const [z,sym,nameJa,weight,grp,period,config,year,use]=el;
  const ic=document.getElementById('info-card');
  ic.classList.remove('hidden');
  document.getElementById('ic-title').textContent=`${sym} — ${nameJa} (Z=${z})`;
  document.getElementById('ic-body').innerHTML=`
    <div><span class="text-zinc-500">原子量</span><br/><span class="text-white font-mono">${weight /* xss-ok: 元素ハードコードデータの原子量 */}</span></div>
    <div><span class="text-zinc-500">電子配置</span><br/><span class="text-white font-mono text-xs">${config /* xss-ok: 元素ハードコードデータの電子配置 */}</span></div>
    <div><span class="text-zinc-500">発見年</span><br/><span class="text-white">${year /* xss-ok: 元素ハードコードデータの発見年 */}</span></div>
    <div><span class="text-zinc-500">主な用途</span><br/><span class="text-white">${use /* xss-ok: 元素ハードコードデータの用途 */}</span></div>
  `;
}

loadProgress();
updateProgressBars();
startReview();
</script>
</body>
</html>
